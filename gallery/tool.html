<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>素材预处理&打包工具</title>
<link rel="stylesheet" href="./toolstyle.css">
</head>
<body>
<div class="wrap-box">
  <h2>🛠️ 素材预处理工具</h2>
  <div class="grid-three">
    <div style="border:1px solid #ddd;padding:12px;border-radius:6px;">
      <h4>① 图片处理 → 输出PNG</h4>
      <p class="tip-text">支持JPG/PNG，等比居中+自选底色</p>
      <select id="sizeSelect">
        <option value="1000">1000 × 1000</option>
        <option value="550" selected>550 × 550</option>
        <option value="220">220 × 220</option>
        <option value="custom">自定义宽高</option>
      </select>
      <div id="customSizeBox" style="margin:6px 0;display:none;">
        <input type="number" id="inpW" placeholder="宽" style="width:70px;">
 ×
 <input type="number" id="inpH" placeholder="高" style="width:70px;">
      </div>
      <div style="margin:6px 0;">
        <label>画布底色：</label>
        <select id="bgSelect">
          <option value="transparent">🔹 透明（桌宠帧推荐）</option>
          <option value="#ffffff">⬜ 白色</option>
          <option value="#000000">⬛ 黑色</option>
          <option value="#00ff00">🟩 绿色</option>
        </select>
      </div>
      <input type="file" id="inpResize" accept=".jpg,.jpeg,.png" style="margin-top:6px;">
      <div id="tipResize" class="tip-text"></div>
      <button id="btnResize" style="margin-top:8px;padding:4px 10px;">处理并下载PNG</button>
    </div>

    <div style="border:1px solid #ddd;padding:12px;border-radius:6px;">
      <h4>② PNG序列合成GIF</h4>
      <p class="tip-text">用于preview预览动图</p>
      <input type="file" id="inpSeq2Gif" accept=".png" multiple>
      <label>帧间隔(ms)：<input type="number" id="gifDelay" value="200" style="width:60px;"></label>
      <div id="tipSeq2Gif" class="tip-text"></div>
      <button id="btnSeq2Gif" style="margin-top:8px;padding:4px 10px;">合成GIF</button>
    </div>
  </div>
</div>
<div class="wrap-box">
  <h2>📦 完整桌宠素材打包器（输出标准zip）</h2>
  <p>⚠️ frames动作帧只支持 <b>PNG</b>；preview目录允许PNG+GIF，JPG请先用上方预处理工具转换</p>
  <div class="grid-two">
    <div style="border:1px solid #ddd;padding:12px;border-radius:6px;">
      <h4>🖼️ preview画廊预览素材</h4>
      <div style="margin:10px 0;">
        <label>卡片封面 card.png：</label>
        <input type="file" id="fileCard" accept=".png">
        <div id="tipCard" class="tip-text"></div>
      </div>
      <div style="margin:10px 0;">
        <label>缩略图 thumb.png：</label>
        <input type="file" id="fileThumb" accept=".png">
        <div id="tipThumb" class="tip-text"></div>
      </div>
      <div style="margin:10px 0;">
        <label>预览动图 preview.gif：</label>
        <input type="file" id="filePreviewGif" accept=".gif">
        <div id="tipGif" class="tip-text"></div>
      </div>
    </div>
    <div style="border:1px solid #ddd;padding:12px;border-radius:6px;">
      <h4>🎞️ frames动作序列帧（仅PNG）</h4>
      <div style="margin:10px 0;">
        <label>① idle待机帧：</label>
        <input type="file" id="fileIdle" accept=".png" multiple>
        <div id="listIdle" class="tip-text"></div>
      </div>
      <div style="margin:10px 0;">
        <label>② walk行走帧：</label>
        <input type="file" id="fileWalk" accept=".png" multiple>
        <div id="listWalk" class="tip-text"></div>
      </div>
      <div style="margin:10px 0;">
        <label>③ click点击帧：</label>
        <input type="file" id="fileClick" accept=".png" multiple>
        <div id="listClick" class="tip-text"></div>
      </div>
    </div>
  </div>
  <div style="margin:16px 0;">
    <label>素材名称：</label>
    <input type="text" id="petName" placeholder="例如：关羽" style="padding:4px;width:260px;">
  </div>
  <button id="btnBuild" style="padding:7px 16px;">✅ 生成完整素材包ZIP</button>
  <div id="tipBox" style="margin-top:12px;color:#222;"></div>
</div>
<!--第三方库，必须写在这里，顺序不能改动-->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.min.js"></script>
<!--加载我们自己完整的JS逻辑文件-->
<script src="./toollogic.js"></script>
</body>
</html>
